# xcodegen spec for the Morse Runner macOS app (AppKit). Generate the
# project with `xcodegen generate` in this directory; the engine is the
# local Swift package defined by Package.swift.
name: MorseRunner
options:
  bundleIdPrefix: com.garciamike1
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
packages:
  MorseRunnerKit:
    path: .
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.68"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES
    SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
targets:
  MorseRunner:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
      - path: ../resources/data/Master.dta
        buildPhase: resources
      - path: ../resources/docs/Readme.txt
        buildPhase: resources
      - path: ../resources/icons/MorseRunner.icns
        buildPhase: resources
    dependencies:
      - package: MorseRunnerKit
        product: MorseRunnerKit
    info:
      path: App/Info.plist
      properties:
        CFBundleName: MorseRunner
        CFBundleDisplayName: Morse Runner
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundlePackageType: APPL
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleIconFile: MorseRunner.icns
        CFBundleDevelopmentRegion: en
        LSMinimumSystemVersion: "15.0"
        LSApplicationCategoryType: public.app-category.utilities
        NSHighResolutionCapable: true
        NSHumanReadableCopyright: "(C) 2004-2006 Alex Shovkoplyas, VE3NEA. macOS port (C) 2026 Mike Garcia. Released under MPL 2.0."
        NSPrincipalClass: NSApplication
    settings:
      base:
        PRODUCT_NAME: MorseRunner
        PRODUCT_BUNDLE_IDENTIFIER: com.garciamike1.morserunner
        ENABLE_HARDENED_RUNTIME: YES
        # Referenced by setting, not xcodegen's `entitlements:` key, which
        # would rewrite the shared file.
        CODE_SIGN_ENTITLEMENTS: ../resources/MorseRunner.entitlements
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEAD_CODE_STRIPPING: YES
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor

  # App-hosted unit tests (Swift Testing) for the AppKit layer.
  MorseRunnerAppTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: App/Tests
    dependencies:
      - target: MorseRunner
      - package: MorseRunnerKit
        product: MorseRunnerKit
    settings:
      base:
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/MorseRunner.app/Contents/MacOS/MorseRunner
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.garciamike1.morserunner.tests

schemes:
  MorseRunner:
    build:
      targets:
        MorseRunner: all
        MorseRunnerAppTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MorseRunnerAppTests
        - package: MorseRunnerKit/MRCoreTests
        - package: MorseRunnerKit/MRDSPTests
        - package: MorseRunnerKit/MRScoringTests
        - package: MorseRunnerKit/MRSimulationTests
        - package: MorseRunnerKit/MRAudioTests
        - package: MorseRunnerKit/MRPersistenceTests
        - package: MorseRunnerKit/MRAppCoreTests
